<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 26px;
    }

    header p {
      margin-top: 6px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h2 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    .card p {
      color: #64748b;
      margin-bottom: 25px;
    }

    .input-box {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 20px;
      font-size: 14px;
      color: #475569;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .feature {
      padding: 15px;
      background: #f8fafc;
      border-radius: 12px;
      font-size: 13px;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .input-box {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .container {
        margin: 30px auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Media Downloader</h1>
    <p>Simple and fast media download tool</p>
  </header>

  <main class="container">
    <div class="card">

      <h2>Download Media</h2>

      <p>
        Paste your media URL below
      </p>

      <div class="input-box">
        <input
          type="url"
          id="url"
          placeholder="Paste media URL here..."
        >

        <button onclick="downloadMedia()">
          Download
        </button>
      </div>

      <div id="message"></div>

      <div class="features">
        <div class="feature">
          ⚡ Fast
        </div>

        <div class="feature">
          📱 Mobile Friendly
        </div>

        <div class="feature">
          🔒 Simple & Easy
        </div>
      </div>

    </div>
  </main>

  <footer>
    © 2026 Media Downloader
  </footer>

  <script>
    function downloadMedia() {
      const url = document.getElementById("url").value.trim();
      const message = document.getElementById("message");

      if (!url) {
        message.textContent = "Please enter a media URL.";
        return;
      }

      message.textContent =
        "URL received. A downloader backend/API is required to process this link.";
    }
  </script>

</body>
</html>
